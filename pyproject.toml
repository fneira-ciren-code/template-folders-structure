[project]
name = "template-folders-structure"
version = "0.1.0"
description = "Hybrid multi-language project structure template and CLI scaffold"
readme = "README.md"
authors = [
    { name = "fneira-ciren-code", email = "fneira@ciren.cl" }
]
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.0.0",
]

[project.scripts]
template-folders-structure = "template_folders_structure:main"

[dependency-groups]
dev = [
    "pylint>=3.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 80
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "W",  # pycodestyle warnings
    "I",  # isort (import sorting)
    "N",  # pep8-naming
]
 
[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod"]
# Add specific variable names here if pep8-naming flags them incorrectly
extend-ignore-names = ["my_special_const"]
