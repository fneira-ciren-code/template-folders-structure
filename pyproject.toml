[project]
name = "template-folders-structure"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fneira-ciren-code", email = "fneira@ciren.cl" }
]
requires-python = ">=3.14"
dependencies = [
    "geopandas>=1.2.0",
    "numba>=0.68.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pydotenv>=0.0.7",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[project.scripts]
template-folders-structure = "template_folders_structure:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
